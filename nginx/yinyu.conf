# ============================================================
# yinyu Nginx 配置示例
#   - /api/          反代到 FastAPI (uvicorn 127.0.0.1:8000)
#   - /uploads/      直接代理磁盘目录 /data/uploads/ (不经后端,性能高)
#   - /              Web 管理后台静态资源
# 部署:复制到 /etc/nginx/conf.d/yinyu.conf,nginx -t && nginx -s reload
#
# 安全须知:
#   1. 生产必须 HTTPS:宝塔 → 网站 → SSL 部署证书(或把 listen 改 443 ssl 并配
#      证书路径,再加 80 → 443 跳转)。没有 TLS,"抓包"就是真明文。
#   2. 顶层三条 limit_*_zone 属 http 层指令:本文件被 include 进 http{} 时有效;
#      若只粘贴 server 块,把这三行放到 http 层,且全机只能定义一次(重复定义报
#      "already bound")。
#   3. Swagger/openapi 不在此放行:应用层已按环境关闭(APP_ENV != dev 时 docs_url=None),
#      /health 系列保留给宝塔/监控探活。
# ============================================================

# 按 IP 限速区(均值放宽、突发放行,只压"持续高倍速"的脚本行为):
#   api:     均值 30 req/s、突发 60 —— 正常 App / 后台绰绰有余
#   uploads: 均值 20 req/s、突发 60 —— 一次 feed 刷新十几张图的突发能过,持续爬取被压
limit_req_zone $binary_remote_addr zone=yinyu_api_req:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=yinyu_uploads_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=yinyu_uploads_conn:10m;

server {
    listen 80;
    server_name yinyu.example.com;

    # 文件上传上限,略大于后端 MAX_UPLOAD_MB
    client_max_body_size 60m;

    # 限流超限返回 429(默认 503 会误导监控告警)
    limit_req_status 429;
    limit_conn_status 429;

    # ---------- 静态上传文件:Nginx 直连磁盘 ----------
    location /uploads/ {
        alias /data/uploads/;
        access_log off;
        # 文件名是 uuid、内容不可变 → 长缓存 + immutable(客户端连协商请求都不再发)
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 防刷:单 IP 并发连接 ≤10,单连接限速 2MB/s(图片无感,大视频拉取被压),
        # 再叠加速率窗口;被刷时消耗的是攻击者的等待,不是你的带宽
        limit_conn yinyu_uploads_conn 10;
        limit_rate 2m;
        limit_req zone=yinyu_uploads_req burst=60 nodelay;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=yinyu_api_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 健康检查(宝塔/监控探活) ----------
    location ~ ^/health(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---------- Web 管理后台(构建产物) ----------
    root /www/wwwroot/yinyu-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip(覆盖 /api/ 的 JSON 与后台静态资源;图片已是 webp 不再压)
    # gzip_static:优先吐 vite 构建预生成的 .gz(vite-plugin-compression),免去每次请求动态压缩
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
}
